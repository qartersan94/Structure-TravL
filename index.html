    <!-- Page Title -->
    <title>Structure TravL | Plateforme Esports League of Legends</title>
    
    <!-- Inline Critical CSS -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: 'Rajdhani', sans-serif;
        background-color: #000000;
        color: #ffffff;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Loading Screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #000000 0%, #0a0a0a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }
      
      .loader {
        width: 80px;
        height: 80px;
        border: 4px solid #1a1a1a;
        border-top: 4px solid #DC143C;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      .loading-text {
        margin-top: 20px;
        font-family: 'Bebas Neue', sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 3px;
        color: #DC143C;
        text-transform: uppercase;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      
      #root.loaded {
        opacity: 1;
      }
    </style>
  </head>
  
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loader"></div>
      <div class="loading-text">Loading Arena...</div>
    </div>
    
    <!-- Main App Container -->
    <div id="root"></div>
    
    <!-- Hide loading screen when app is ready -->
    <script>
      window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loading-screen');
        const root = document.getElementById('root');
        
        setTimeout(() => {
          loadingScreen.classList.add('hidden');
          root.classList.add('loaded');
        }, 1500);
      });
    </script>
    
    <!-- Main App Script -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- No Script Fallback -->
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: Arial, sans-serif; background: #000; color: #fff;">
        <h1>JavaScript Required</h1>
        <p>Cette application nécessite JavaScript pour fonctionner.</p>
      </div>
    </noscript>
  </body>
</html>
